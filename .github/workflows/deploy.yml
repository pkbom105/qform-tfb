name: Deploy to VPS (ns1)

on:
  # Trigger 1: Push to main branch
  push:
    branches: [main]

  # Trigger 2: Manual trigger via GitHub UI button
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /home/qform/app
            cd /home/qform/app
            if [ -d .git ]; then
              git fetch origin main --force
              git reset --hard origin/main
            else
              git clone https://github.com/pkbom105/qform-tfb.git .
              git checkout main
            fi
            npm install
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker image prune -f