name: Deploy to VPS (ns1)

on:
  # Trigger 1: Push to main branch
  push:
    branches: [main]

  # Trigger 2: Manual trigger via GitHub UI button
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" '
            set -e
            echo "[deploy] starting"
            mkdir -p /home/qform/app
            cd /home/qform/app
            echo "[deploy] working dir: $(pwd)"
            if [ -d .git ]; then
              echo "[deploy] updating existing repo"
              git fetch origin main --force
              git reset --hard origin/main
            else
              echo "[deploy] cloning repo"
              git clone https://github.com/pkbom105/qform-tfb.git .
              git checkout main
            fi
            echo "[deploy] installing deps"
            npm install
            echo "[deploy] restarting containers"
            docker compose down --remove-orphans || true
            docker compose up -d --build
            echo "[deploy] pruning old images"
            docker image prune -f
          '