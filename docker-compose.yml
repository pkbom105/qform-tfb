services:
  # --- 1. App Database (Postgres) ---
  db:
    image: docker.io/library/postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-qform.admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=qform2026
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qform-network

  # --- 2. Toffy Boutique Next.js App ---
  qform-app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /home/qform/app/public/uploads:/app/public/uploads
      - /home/qform/upload2:/home/qform/uploads
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - qform-network

volumes:
  postgres_data:

networks:
  qform-network:
    driver: bridge

