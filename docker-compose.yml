services:
  # --- 1. App Database (Postgres) ---
  db:
    image: postgres:15-alpine
    container_name: qform-db
    restart: always
    environment:
      - POSTGRES_USER=qform.admin
      - POSTGRES_PASSWORD=Brubrat.258
      - POSTGRES_DB=customer_data
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok

    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - qform-network

  # --- 2. Toffy Boutique Next.js App ---
  qform-app:
    build: ./app
    container_name: qform-tfb
    restart: always
    ports:
      - "3000:3000" # เปิด port ภายในเพื่อให้ NPM มองเห็น
    volumes:
      - ./uploads:/app/public/uploads
      - /home/qform/upload2:/home/qform/uploads
    env_file:
      - ./app/.env
    depends_on:
      - db
    networks:
      - qform-network


networks:
  qform-network:
    driver: bridge

